# The mocked unit tests. Database, google places and telegram are replaced by
# test doubles, so this workflow needs no secrets, no MariaDB service and no
# network - unlike `pytest.yml`, which does and therefore runs in the
# "My Environment" environment.
name: unittests
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: snok/install-poetry@v1
        with:
          version: 2.0.0
          virtualenvs-create: true
          virtualenvs-in-project: true
      - run: poetry install --no-interaction --with=dev
      - name: Run tests with coverage
        run: poetry run coverage run -m pytest tests/ -v --junitxml=reports/junit/junit.xml
      - name: Coverage report
        run: |
          poetry run coverage report
          poetry run coverage xml -o reports/coverage/coverage.xml
          poetry run coverage html -d reports/coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (python ${{ matrix.python-version }})"
            echo
            echo '```'
            poetry run coverage report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: reports
