[tool.poetry]
name = "leistungsbot"
version = "1.1.3.post2.dev0+52c2b73"
description = ""
authors = ["EckPhi"]
readme = "README.md"
include = [
  { path = "resources", format = ["sdist", "wheel"] },
  { path = "leistungsbot/schema.sql", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
pyTelegramBotAPI = "^4.5.0"
googlemaps = "^4.10.0"
pyyaml = "^6.0.2"
urllib3 = "^2.2.2"
schedule = "^1.2.2"
python-telegram-bot-calendar = "^1.0.5"
requests = "^2.32.3"
platformdirs = "^4.2.2"
confuse = "^2.0.1"


[tool.poetry.scripts]
leistungsbot = "leistungsbot.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
black = "26.5.1"
pre-commit = "^3.8.0"
genbadge = {extras = ["all"], version = "^1.1.1"}
coverage = "^7.6.1"
ruff = "^0.16.1"


[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }


[tool.poetry-dynamic-versioning]
enable = true
[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.mypy]
disallow_untyped_defs = true


[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# E,F  what flake8 checked    I   what reorder-python-imports did
# UP   what pyupgrade did     B   bugbear, cheap and catches real mistakes
select = ["E", "F", "I", "UP", "B"]
# black owns line length, same as the old flake8 --extend-ignore E501
ignore = ["E501"]

[tool.ruff.lint.isort]
# one import per line, and the __future__ import on top, which is how
# reorder-python-imports left this code base
force-single-line = true
required-imports = ["from __future__ import annotations"]


[tool.coverage.run]
source = ["leistungsbot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
