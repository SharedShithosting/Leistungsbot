[tool.poetry]
name = "leistungsbot"
# Placeholder. The real version comes from the git tag, see
# [tool.poetry-dynamic-versioning] below. Never edit this by hand.
version = "0.0.0"
description = ""
authors = ["EckPhi"]
readme = "README.md"
include = [
  { path = "resources", format = ["sdist", "wheel"] },
  { path = "leistungsbot/schema.sql", format = ["sdist", "wheel"] },
]

# Only what leistungsbot/ actually imports. requests, urllib3 and pyyaml
# used to be listed here too, which read as if the code used them - it never
# did. They arrive through googlemaps/pyTelegramBotAPI, requests and confuse
# respectively, and poetry.lock is what pins them. See #85.
[tool.poetry.dependencies]
python = "^3.11"
pyTelegramBotAPI = "^4.5.0"
googlemaps = "^4.10.0"
schedule = "^1.2.2"
python-telegram-bot-calendar = "^1.0.5"
# imported by leistungs_config, for the default config location
platformdirs = "^4.2.2"
confuse = "^2.0.1"
google-api-python-client = "^2.198.0"
google-auth = "^2.56.2"


[tool.poetry.scripts]
leistungsbot = "leistungsbot.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "26.5.1"
pre-commit = "^3.8.0"
genbadge = {extras = ["all"], version = "^1.1.1"}
coverage = "^7.6.1"
ruff = "^0.16.1"


[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }


# The version is derived from `git describe`, so a release is just a tag:
#   v1.3.0 exactly          -> 1.3.0
#   3 commits past v1.3.0   -> 1.3.0.post3.dev0+<short sha>
#   dirty working tree      -> ...+<short sha>.dirty
# `strict = false` keeps builds from a tarball or a shallow checkout working:
# without git they fall back to the placeholder above instead of failing.
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# the default pattern already matches the `v1.2.3` tags this repo uses
strict = false

# Rewrites leistungsbot/_version.py in place at build time. That file is
# committed as a placeholder so the package is importable from a plain
# checkout, and the Dockerfile copies the substituted copy into the image.
[tool.poetry-dynamic-versioning.substitution]
files = ["leistungsbot/_version.py"]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"


[tool.mypy]
disallow_untyped_defs = true


[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
# E,F  what flake8 checked    I   what reorder-python-imports did
# UP   what pyupgrade did     B   bugbear, cheap and catches real mistakes
select = ["E", "F", "I", "UP", "B"]
# black owns line length, same as the old flake8 --extend-ignore E501
ignore = ["E501"]

[tool.ruff.lint.isort]
# one import per line, and the __future__ import on top, which is how
# reorder-python-imports left this code base
force-single-line = true
required-imports = ["from __future__ import annotations"]


[tool.coverage.run]
source = ["leistungsbot"]
branch = true
omit = [
  # the `python -m leistungsbot` shim, three lines that only call main()
  "leistungsbot/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# There is no per file equivalent of fail_under, so the 75% floor every
# file has to clear lives in tools/check_coverage.py. This one keeps the
# project total honest as well.
fail_under = 75
